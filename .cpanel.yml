---
# Déploiement cPanel : déclenché à chaque « Update from Remote » puis
# « Deploy HEAD Commit » dans Git Version Control.
# ATTENTION : remplacer <UTILISATEUR_CPANEL> par l'utilisateur réel du compte.
deployment:
  tasks:
    - export DEPLOYPATH=/home/<UTILISATEUR_CPANEL>/public_html/
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp -R les-disciplines $DEPLOYPATH
    - /bin/cp -R les-professionnels $DEPLOYPATH
    - /bin/cp -R event $DEPLOYPATH
    - /bin/cp -R contact $DEPLOYPATH
    - /bin/cp -R le-centre-de-formation $DEPLOYPATH
    - /bin/cp index.html $DEPLOYPATH
    - /bin/cp 404.html $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/cp robots.txt $DEPLOYPATH
    - /bin/cp sitemap.xml $DEPLOYPATH
